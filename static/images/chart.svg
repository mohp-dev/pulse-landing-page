<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Cash flow chart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- bars -->
  <g fill="#00b06b">
    <rect x="106"  y="254" width="33" height="166"/>
    <rect x="259"  y="280" width="33" height="140"/>
    <rect x="411"  y="276" width="33" height="144"/>
    <rect x="565"  y="230" width="33" height="190"/>
    <rect x="718"  y="248" width="33" height="172"/>
    <rect x="871"  y="185" width="33" height="235"/>
    <rect x="1024" y="83"  width="33" height="337"/>
    <rect x="1177" y="8"   width="33" height="412"/>
  </g>
  <g fill="#f78a86">
    <rect x="140"  y="280" width="33" height="140"/>
    <rect x="293"  y="269" width="33" height="151"/>
    <rect x="445"  y="289" width="33" height="131"/>
    <rect x="599"  y="241" width="33" height="179"/>
    <rect x="752"  y="112" width="33" height="308"/>
    <rect x="906"  y="321" width="33" height="99"/>
    <rect x="1059" y="221" width="33" height="199"/>
    <rect x="1212" y="83"  width="33" height="337"/>
  </g>

  <!-- area under the line (covers the bars) -->
  <polygon fill="#ffffff"
    points="0,372 139,400 292,363 444,374 597,344 751,322 904,408 1057,322 1211,160 1366,108 1366,420 0,420"/>

  <!-- vertical guide lines -->
  <g stroke="#e3e6e4" stroke-width="2">
    <line x1="292"  y1="363" x2="292"  y2="420"/>
    <line x1="444"  y1="374" x2="444"  y2="420"/>
    <line x1="597"  y1="344" x2="597"  y2="420"/>
    <line x1="751"  y1="322" x2="751"  y2="420"/>
    <line x1="1057" y1="322" x2="1057" y2="420"/>
    <line x1="1211" y1="160" x2="1211" y2="420"/>
  </g>

  <!-- blue line -->
  <polyline fill="none" stroke="#85c1f5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
    points="0,372 139,400 292,363 444,374 597,344 751,322 904,408 1057,322 1211,160 1366,108"/>

  <!-- dots -->
  <g fill="#85c1f5">
    <circle cx="139"  cy="400" r="11"/>
    <circle cx="292"  cy="363" r="11"/>
    <circle cx="444"  cy="374" r="11"/>
    <circle cx="597"  cy="344" r="11"/>
    <circle cx="751"  cy="322" r="11"/>
    <circle cx="904"  cy="408" r="11"/>
    <circle cx="1057" cy="322" r="11"/>
    <circle cx="1211" cy="160" r="11"/>
  </g>
</svg>
